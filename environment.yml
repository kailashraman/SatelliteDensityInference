# The Python environment the papers were produced in (the authors' `J_calc`
# conda environment on linux-64), pruned to the packages this repository
# imports and pinned to the versions installed there.
#
#   conda env create -f environment.yml
#   conda activate sdi
#
# The pymc/pytensor/numpy/scipy/arviz pins matter for bit-level reproduction
# of the power-law posteriors (docs/pymc-environment.md). LaTeX is not
# included: the figures need a `latex` binary, located through
# $SDI_TEXLIVE_BIN (see python/config.py).
name: sdi
channels:
  - conda-forge
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - scipy=1.14.1
  - matplotlib-base=3.9.2
  - astropy=6.1.3
  - h5py=3.12.1
  - pandas=2.2.3
  - kdepy=1.1.9
  - corner=2.2.3
  - iminuit=2.32.0
  - tqdm=4.66.5
  - requests=2.32.4
  - pymc=5.25.1
  - pytensor=2.31.7
  - arviz=0.21.0
  - satgen=0.1.0
  - pytest=7.4.4
  - pip
  - pip:
      - colossus==1.3.6
      - vegas==6.1.3
